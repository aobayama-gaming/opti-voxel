<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biome studio</title>
<link rel="stylesheet" href="lab.css">
<link rel="stylesheet" href="studio.css">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <b class="brand">Biome studio</b>
  <select id="table" title="Tables under adapter/godot/project/climate/"></select>
  <span id="dirty" class="badge">saved</span>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  <button id="save" class="primary" title="Ctrl+S">Save</button>
  <span class="spacer"></span>
  <button id="fly" title="Open the game on what the view shows (a Godot window)">Fly it</button>
  <button id="open-editor" title="Every key of the table: fields, regions, curves, JSON">Full editor →</button>
</header>
<main class="studio">
  <nav id="biomes"></nav>
  <section id="stage">
    <div class="modes" id="modes"></div>
    <div class="canvasbox"><canvas id="view"></canvas>
      <div id="status" class="overlay status"></div>
      <div id="probe" class="overlay probe" hidden></div>
      <div id="refused" class="overlay refused" hidden></div>
    </div>
    <div class="viewbar" id="viewbar"></div>
  </section>
  <aside id="controls"></aside>
</main>
<div id="toast"></div>
<script type="module" src="studio.js"></script>
</body>
</html>
