# Formatting, a warnings-as-errors build and the C++ unit tests (headless Godot, no GPU) on every
# pull request and on pushes to dev / main. The GPU checks (tools/check.sh) need a real GPU and
# an unlocked session: they stay local.
name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3
  CLANG_FORMAT_VERSION: 23.1.3

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: linux

      - name: Format
        run: |
          python -m pip install "clang-format==${CLANG_FORMAT_VERSION}"
          CLANG_FORMAT=clang-format tools/format.sh --check

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: linux_x86_64_single_template_debug

      - name: Build (warnings are errors)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: scons platform=linux target=template_debug werror=yes -j"$(nproc)"

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: linux_x86_64_single_template_debug

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Unit tests
        run: |
          export GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          # The import registers the extension (headless, the terrain prints one ERROR and stays empty).
          # A fresh import can abort at exit in Godot 4.6.3 (dev reproduces it), after
          # the import is done: run it again, and the second run, on an imported project, must exit 0.
          "$GODOT" --headless --path project --import > import.log 2>&1 ||
            "$GODOT" --headless --path project --import > import.log 2>&1 || { tail -30 import.log; exit 1; }
          test -f project/.godot/extension_list.cfg || { tail -30 import.log; exit 1; }
          tools/unit_test.sh --no-build
